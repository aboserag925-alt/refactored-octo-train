name: bootstrap-orch
on:
  push:
    branches: [feature/orchestrator-cjs]
    paths: ['.github/workflows/bootstrap-orch.yml']
permissions:
  contents: write
jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch verify test commit
        run: |
          set -e
          D=abu-seraj-orchestrator-cjs
          B=https://96504380-d9ab-435e-8bde-3bf1372f947f.usrfiles.com/ugd
          curl -fsSL $B/fd0ed3_18e8d3da8c0849878135ace2f347b6f4.txt -o $D/abu-seraj-all-in-one.js
          curl -fsSL $B/fd0ed3_35a4686a247347e792179d4205371f1b.txt -o $D/test/orchestrator.test.js
          curl -fsSL $B/fd0ed3_8d1454461ba14a4f9507ffbb59dcf5d1.txt -o $D/README.md
          echo 'edf5f7518fe496dae6cdac5a19949e684d7b496f2e72f80b9b03a0e566d7f3a5  '$D/abu-seraj-all-in-one.js > sums
          echo '20c8b857b84f475ae341b26f42029b951e98821f1bfc0f29469c4f54f681b9f9  '$D/test/orchestrator.test.js >> sums
          echo 'ecbdca3285e0dd27d7524e3fdf59b02b0bc8cb46c4b975728f9eae8283d42353  '$D/README.md >> sums
          sha256sum -c sums
          rm sums
          node --check $D/abu-seraj-all-in-one.js
          node --test $D/test/orchestrator.test.js
          git rm -q .github/workflows/bootstrap-orch.yml
          git config user.name 'github-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add $D
          git commit -m 'fix(orchestrator): apply security review fixes 1-7, add external-communication risk, tests'
          git push origin HEAD:feature/orchestrator-cjs
